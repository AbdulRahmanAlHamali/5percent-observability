---
helmDefaults:
  createNamespace: true

repositories:
  - name: grafana
    url: https://grafana.github.io/helm-charts

releases:
  - name: loki
    namespace: logging
    chart: grafana/loki
    version: 6.55.0
    labels:
      stack: logging
    values:
      - ./helm-values/loki-values.yaml

  - name: alloy
    namespace: logging
    chart: grafana/alloy
    version: 1.11.1
    labels:
      stack: logging
    needs:
      - logging/loki
    values:
      - ./helm-values/alloy-values.yaml
