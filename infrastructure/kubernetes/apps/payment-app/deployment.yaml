apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-app
  namespace: payment-checkout
  labels:
    app.kubernetes.io/name: payment-app
    app.kubernetes.io/part-of: fivepercent-observability-lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: payment-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: payment-app
        app.kubernetes.io/part-of: fivepercent-observability-lab
    spec:
      containers:
        - name: payment-app
          image: fivepercent-observability-payment-app:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: APP_PORT
              value: "8080"
            - name: LOG_LEVEL
              value: INFO
            - name: UNLEASH_URL
              value: "http://unleash.feature-flags.svc.cluster.local:4242/api"
            - name: UNLEASH_APP_NAME
              value: payment-app
            - name: UNLEASH_API_TOKEN
              value: "default:development.unleash-insecure-payment-app-token"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
